apiVersion: v1
kind: Service
metadata:
  name: ehridentityag
  labels:
    app: ehridentityag
spec:
  ports:
    - port: 80  # Target port for the ehridentityag application
      targetPort: 8000
      nodePort: 30032  # Optional: Specify a NodePort (range: 30000-32767)
  selector:
    app: ehridentityag
    tier: frontend
  type: NodePort  # Changed from LoadBalancer to NodePort

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ehridentityag-pv-claim
  labels:
    app: ehridentityag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehridentityag
  labels:
    app: ehridentityag
spec:
  selector:
    matchLabels:
      app: ehridentityag
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ehridentityag
        tier: frontend
    spec:
      containers:
      - image: hosamzolfonoon/ehridentityag:0717
        imagePullPolicy: Always
        name: ehridentityag
        command: ["nginx", "-g", "daemon off;"]  # Keeps Nginx running in the foreground
        env:
        - name: ehridentityag_DB_HOST
          value: speechtextfast-mysql
        
        - name: ehridentityag_DB_USER
          value: speechtextfast
        
        - name: ehridentityag_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: speechtextfast-mysql-pass
              key: password
        
        - name: ehridentityag_DB_NAME
          value: speechtextfast  # 🔹 Added missing database name
        
        ports:
        - containerPort: 80
          name: ehridentityag
        
        volumeMounts:
        - name: ehridentityag-persistent-storage
          mountPath: /var/www/html
      
      volumes:
      - name: ehridentityag-persistent-storage
        persistentVolumeClaim:
          claimName: ehridentityag-pv-claim
          
