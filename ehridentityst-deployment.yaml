apiVersion: v1
kind: Service
metadata:
  name: ehridentityst
  labels:
    app: ehridentityst
spec:
  ports:
    - port: 80  # Target port for the ehridentityst application
      targetPort: 8501
      nodePort: 30010  # Optional: Specify a NodePort (range: 30000-32767)
  selector:
    app: ehridentityst
    tier: frontend
  type: NodePort  # Changed from LoadBalancer to NodePort

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ehridentityst-pv-claim
  labels:
    app: ehridentityst
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehridentityst
  labels:
    app: ehridentityst
spec:
  selector:
    matchLabels:
      app: ehridentityst
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ehridentityst
        tier: frontend
    spec:
      containers:
      - image: hosamzolfonoon/ehridentityst:0710
        imagePullPolicy: Always
        name: ehridentityst
        command: ["nginx", "-g", "daemon off;"]  # Keeps Nginx running in the foreground
        env:
        - name: ehridentityst_DB_HOST
          value: speechtextfast-mysql
        
        - name: ehridentityst_DB_USER
          value: speechtextfast
        
        - name: ehridentityst_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: speechtextfast-mysql-pass
              key: password
        
        - name: ehridentityst_DB_NAME
          value: speechtextfast  # 🔹 Added missing database name
        
        ports:
        - containerPort: 80
          name: ehridentityst
        
        volumeMounts:
        - name: ehridentityst-persistent-storage
          mountPath: /var/www/html
      
      volumes:
      - name: ehridentityst-persistent-storage
        persistentVolumeClaim:
          claimName: ehridentityst-pv-claim
          
