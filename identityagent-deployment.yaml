apiVersion: v1
kind: Service
metadata:
  name: identityagent
  labels:
    app: identityagent
spec:
  ports:
    - port: 80  # Target port for the identityagent application
      targetPort: 8000
      nodePort: 30010  # Optional: Specify a NodePort (range: 30000-32767)
  selector:
    app: identityagent
    tier: frontend
  type: NodePort  # Changed from LoadBalancer to NodePort

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identityagent-pv-claim
  labels:
    app: identityagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityagent
  labels:
    app: identityagent
spec:
  selector:
    matchLabels:
      app: identityagent
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: identityagent
        tier: frontend
    spec:
      containers:
      - image: hosamzolfonoon/identityagent:0713
        imagePullPolicy: Always
        name: identityagent
        command: ["nginx", "-g", "daemon off;"]  # Keeps Nginx running in the foreground
        env:
        - name: identityagent_DB_HOST
          value: speechtextfast-mysql
        
        - name: identityagent_DB_USER
          value: speechtextfast
        
        - name: identityagent_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: speechtextfast-mysql-pass
              key: password
        
        - name: identityagent_DB_NAME
          value: speechtextfast  # 🔹 Added missing database name
        
        ports:
        - containerPort: 80
          name: identityagent
        
        volumeMounts:
        - name: identityagent-persistent-storage
          mountPath: /var/www/html
      
      volumes:
      - name: identityagent-persistent-storage
        persistentVolumeClaim:
          claimName: identityagent-pv-claim
          
